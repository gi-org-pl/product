<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Generacja Innowacja e-mail signature</title>
</head>
<body style="margin:24px;background:#FFFFFF;">
<!-- Signature: copy everything between the two markers. Before use, replace the image src with the public address of gi-email-logo.png and fill in {{NAME}} and {{ROLE}}. -->
<!-- signature start -->
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:Poppins,Arial,Helvetica,sans-serif;color:#231F20;">
    <tr><td style="padding:0 0 0 10px;font-size:14px;line-height:20px;font-weight:700;">{{NAME}}</td></tr>
    <tr><td style="padding:0 0 0 10px;font-size:13px;line-height:18px;padding-bottom:4px;">{{ROLE}}</td></tr>
    <tr><td style="padding:0;"><img src="gi-email-logo.png" width="185" height="60" alt="Generacja Innowacja" style="display:block;border:0;outline:none;width:185px;height:60px;"></td></tr>
    <tr><td style="padding:0 0 0 10px;font-size:13px;line-height:18px;font-weight:500;"><a href="https://gi.org.pl" style="color:#D91919;text-decoration:none;">gi.org.pl</a></td></tr>
</table>
<!-- signature end -->
</body>
</html>
